# Grafana datasource provisioning for the `obs` compose profile.
#
# Without this file Grafana starts empty and the first thing anyone does is
# click through the Add-datasource wizard to type `http://tempo:3200` —
# every time the container is recreated, because the demo runs Grafana with
# no persistent volume. Ten lines here make `docker compose --profile obs
# up` land on a Grafana that can already see traces.
#
# Phase-5 Batch 5 added the dashboards this file used to disclaim; they
# live in ../../dashboards/ and are wired by ../dashboards/dashboards.yaml.
#
# They are NOT docs/04 §7.3's six-panel board as written. That spec sources
# cost, tokens and error counts from LogQL over the structlog stream, and
# there is still no Loki in this stack. Latency comes from Tempo here as
# specified; cost and per-call tokens come from Postgres `call_costs`
# instead (see postgres.yaml for why that is the more correct source, not
# merely the available one); the error-rate and active-calls panels have no
# non-Loki source and are deliberately absent rather than faked.

apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    # `proxy` = Grafana's backend does the querying, so the URL resolves on
    # the compose network (`tempo`), not in the operator's browser.
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: true
