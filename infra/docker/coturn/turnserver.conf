# infra/docker/coturn/turnserver.conf — coturn for the demo stack (ADR-006).
#
# WHERE THE SECRET IS (read before editing): it is deliberately NOT in this
# file. coturn's config parser has no environment-variable interpolation —
# a `static-auth-secret=${TURN_SECRET}` line here would set the secret to
# those literal characters, not the value (env support is an open feature
# request upstream, coturn#1245). Canon forbids a hardcoded secret in a
# tracked file, so the coturn service's entrypoint in the root
# docker-compose.yml renders a copy of this file at container start:
#
#     umask 077; cp this file to /tmp/turnserver.conf
#     append  static-auth-secret=$TURN_SECRET   (from backend/.env)
#     append  external-ip=$TURN_EXTERNAL_IP     (only if that var is set)
#     exec turnserver -c /tmp/turnserver.conf
#
# Appending to a 0600 temp file — rather than passing --static-auth-secret
# on the command line — also keeps the secret out of the container's
# process table. The same TURN_SECRET is HMAC'd by agent-api when it mints
# `ice_servers` credentials (docs/13 §7); the two must be the same value,
# which is why both containers read it from the same backend/.env.

# --- Credentials -------------------------------------------------------
# The TURN REST API scheme (docs/13 §7): username `<expiry_ts>:<session_id>`,
# credential = base64(HMAC-SHA1(TURN_SECRET, username)). coturn recomputes
# the HMAC and checks the embedded expiry, so there is no user database to
# provision, nothing stored, and a leaked credential dies in ≤ 10 minutes.
use-auth-secret

# Required by the long-term credential mechanism `use-auth-secret` builds
# on: coturn sends this realm in its 401 challenge and the client echoes it
# back. It does not enter the HMAC, so agent-api never needs to know it —
# but it must be non-empty or coturn refuses to authenticate anyone.
realm=vyaparpay.local

# Reject a nonce older than this (seconds). Bounds the window in which a
# captured challenge/response pair can be replayed; 600 s matches the
# TURN_CREDENTIAL_TTL_S=600 credential lifetime so neither outlives the
# other.
stale-nonce=600

# --- Listeners ---------------------------------------------------------
# 3478 is plain STUN/TURN over both UDP and TCP; coturn listens on both
# transports on this port by default, which is why there is no separate
# TCP directive. UDP is the fast path the ICE candidate priorities prefer.
listening-port=3478

# 5349 is the `turns:` fallback — TURN over TLS (TCP) and DTLS (UDP). It
# exists for carrier NATs and corporate firewalls that drop or throttle
# UDP on 3478; docs/13 §7 returns it as the second entry in `ice_servers`.
tls-listening-port=5349

# Bind every interface inside the container. The container has exactly one
# routable interface (the compose bridge), so this is not the widening it
# looks like — it is how coturn stops trying to auto-discover interfaces
# that do not exist here. `relay-ip` is intentionally left unset: it then
# defaults to the listening address, which is correct for a single-homed
# container.
listening-ip=0.0.0.0

# --- Relay port range --------------------------------------------------
# Every TURN allocation grabs one relay port from this range, and every
# port in it has to be published by compose (docker-compose.yml maps
# 49160-49200/udp to match). Kept deliberately small: each published port
# costs one docker-proxy process at `up` time, and the demo is 1:1 calls,
# not a relay fleet. 41 ports is ~20 concurrent relayed calls' worth of
# headroom, which is ~20x what the demo needs. Widen BOTH this range and
# the compose mapping together, or allocations will silently fail on ports
# the host never forwarded.
min-port=49160
max-port=49200

# --- TLS ---------------------------------------------------------------
# Generated by infra/docker/coturn/gen-cert.sh into ./certs, which compose
# mounts read-only at /etc/coturn/certs. Self-signed and DEMO-ONLY — a real
# deployment points these at a CA-issued cert for the real COTURN_HOST
# name. The entrypoint fails fast with an actionable message if these files
# are missing, because coturn's own error for an unreadable cert is easy to
# miss in the startup noise.
cert=/etc/coturn/certs/turn_server_cert.pem
pkey=/etc/coturn/certs/turn_server_pkey.pem

# TLS 1.0/1.1 are dead and only widen the handshake surface; every WebRTC
# client that can speak `turns:` speaks 1.2+.
no-tlsv1
no-tlsv1_1

# --- Hardening ---------------------------------------------------------
# The telnet admin CLI (default port 5766) is an unauthenticated-by-default
# control surface we have no use for. Off.
no-cli

# TURN has no legitimate multicast peer; permitting one only offers an
# amplification vector.
no-multicast-peers

# Do not advertise the coturn version in the SOFTWARE attribute — free
# reconnaissance for anyone scanning 3478.
no-software-attribute

# Total simultaneous allocations. A ceiling, not a tuning knob: it turns
# "someone found our relay" into a bounded resource problem instead of an
# unbounded one. The demo needs single digits.
total-quota=100

# NOT SET, ON PURPOSE — denied-peer-ip for RFC1918 ranges.
#
# The standard coturn hardening is to deny relaying to private address
# space so the relay cannot be used to reach services inside your network:
#     denied-peer-ip=10.0.0.0-10.255.255.255
#     denied-peer-ip=172.16.0.0-172.31.255.255
#     denied-peer-ip=192.168.0.0-192.168.255.255
# In THIS stack the legitimate peer — the voice-worker container — lives on
# the compose bridge at 172.x, so those lines would break exactly the calls
# the relay exists to carry. Enabling them is therefore a deployment
# decision, not a default: once the worker is not a private-IP neighbour
# (i.e. any real deployment), add them, minus the range the worker is on.
# See infra/README.md, "Before this is a real deployment".

# --- Operational -------------------------------------------------------
# Logs to the container's stdout so `docker compose logs -f coturn` is the
# whole story and nothing accumulates on a volume nobody rotates.
log-file=stdout

# The image runs as `nobody`, which cannot write coturn's default
# /var/run/turnserver.pid. /var/tmp is writable and the pidfile is
# meaningless to us anyway (one process, one container).
pidfile=/var/tmp/turnserver.pid

# Add the FINGERPRINT attribute to outgoing STUN/TURN messages — required
# for demultiplexing STUN from media on a shared port, which is exactly
# what a WebRTC ICE agent does.
fingerprint
