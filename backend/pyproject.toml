[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vyapar-agent-api"
version = "0.2.0"
description = "Vyapar voice-calling agent — Phase 2 backend (text-only intelligence loop: context -> prompt -> LLM -> tools -> safety -> cost)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # --- Web framework / server ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # --- Validation / settings ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Data layer ---
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # pgvector's SQLAlchemy type adapter, for memory_chunks.embedding
    # (`vector(1536)`, docs/09 §6.1). A base dependency, not a dev/extra
    # one: app/models/orm.py imports it at module scope and nearly every
    # module in app/ imports that.
    "pgvector>=0.3",
    "redis>=5.0", # ships redis.asyncio
    # --- HTTP client / serialization ---
    "httpx>=0.27",
    "orjson>=3.10",
    # --- Observability ---
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # --- Auth ---
    "pyjwt>=2.9", # JWT verification for the demo auth
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres,redis]>=4.8",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    # tests/obs/test_dashboards.py parses the Grafana/Tempo provisioning
    # YAML under infra/docker/ to check it against the span contract in
    # app/obs/tracing.py. Declared explicitly rather than reached via
    # `pytest.importorskip("yaml")`: an importorskip turns a missing
    # dependency into a green skip, which is exactly how
    # tests/e2e/test_voice_pipeline_e2e.py went unrun for a whole phase
    # (see the audit note at the top of .github/workflows/ci.yml). A
    # dashboard guard that silently stops running is worse than none.
    "pyyaml>=6.0",
    # A hang is worse than a failure: it reports nothing and blocks
    # everything behind it. PR #66 fixed a leaked span-exporter thread
    # that wedged `pytest tests` indefinitely, at a point that moved
    # between runs; a 202-minute-old pytest process was found on a
    # developer machine for a suite that finishes in 38 seconds. Nothing
    # in the suite bounded it, because the only protection was authors
    # remembering to wrap every wait. See [tool.pytest.ini_options].
    "pytest-timeout>=2.3",
]
# Phase-3 voice worker only — agent-api and the test suite never import
# these, so the base install stays lean (`pip install -e ".[dev,voice]"`
# to get them). Floors are the versions current on PyPI at pin time
# (2026-08), matching the base-deps convention above.
voice = [
    # --- WebRTC transport (aiortc + its codec/container layer) ---
    "aiortc>=1.15",
    # NOT ">=18": av 18.0 is current on PyPI, but aiortc 1.15 pins
    # av>=14,<18 — an av>=18 floor here would make the extra unresolvable.
    "av>=17.0",
    # --- Silero VAD inference (docs/06 §5) ---
    "onnxruntime>=1.28",
    # --- Deepgram/ElevenLabs streaming websockets ---
    "websockets>=17.0",
    # --- PCM frame math (resample/convert paths) ---
    "numpy>=2.5",
]

[tool.hatch.build.targets.wheel]
# src-less layout: the package root *is* backend/, importable as `app.*`.
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Without this, an async fixture declared scope="session"/"module" silently
# binds its event loop to that scope while tests run per-function loops —
# the exact latent bug CI's first docker-gated run surfaced in
# tests/models/test_orm.py. Pin every async fixture to the per-test loop.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Turn a hang into a named failing test. Deliberately generous: the whole
# non-Docker suite runs in ~36s and the slowest single test is well under
# a second, so 60s cannot fire on a merely slow test — only on something
# genuinely wedged. It is a backstop, not a performance budget, and it is
# set high on purpose so nobody is tempted to raise it for a flaky test
# instead of fixing the wait.
#
# `method = "thread"` rather than the default `signal`: `signal` relies on
# SIGALRM, which does not exist on Windows, and this project is developed
# on Windows and tested on Linux CI. A guard that silently does nothing on
# the machine where the bug was found would be worse than none — that is
# the same failure mode as the importorskip note above.
#
# The thread method cannot interrupt a C-level blocking call, so this does
# not bound every conceivable hang. It bounds the ones seen so far.
timeout = 60
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
