[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vyapar-agent-api"
version = "0.2.0"
description = "Vyapar voice-calling agent — Phase 2 backend (text-only intelligence loop: context -> prompt -> LLM -> tools -> safety -> cost)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # --- Web framework / server ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # --- Validation / settings ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Data layer ---
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.0", # ships redis.asyncio
    # --- HTTP client / serialization ---
    "httpx>=0.27",
    "orjson>=3.10",
    # --- Observability ---
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # --- Auth ---
    "pyjwt>=2.9", # JWT verification for the demo auth
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres,redis]>=4.8",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
# src-less layout: the package root *is* backend/, importable as `app.*`.
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
