; Alembic config for agent-api's single migration environment (docs/12
; §10 — one Alembic environment, one head, no branches).
;
; sqlalchemy.url is deliberately left blank: migrations/env.py reads
; DATABASE_URL from os.environ directly (not app.config.Settings), so
; the migration environment never imports the app package. Set
; DATABASE_URL (asyncpg driver, e.g. postgresql+asyncpg://...) before
; running `alembic upgrade head`.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
