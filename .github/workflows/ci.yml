# CI — the same three gates every PR in this repo has so far run by hand
# (backend/README.md "Development"), now automatic, plus the first-ever
# automated execution of the Docker-gated test dirs.
#
# Two jobs on purpose:
# - `gates` mirrors the local loop exactly (ruff, mypy, non-Docker pytest)
#   and is the signal to watch on every PR.
# - `docker-gated` runs tests/models + tests/e2e via testcontainers
#   (ubuntu-latest ships a Docker daemon). These suites were written with
#   the Phase-2 build but have NEVER been executed anywhere — no local
#   Docker was available — so this job is genuinely new coverage, not a
#   re-run. It is a separate job so a testcontainers-specific failure is
#   immediately distinguishable from a core-gate failure.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege hardening (security review MEDIUM): neither job performs
# any token-consuming operation, so the ambient GITHUB_TOKEN needs nothing
# beyond checkout. Declaring it explicitly removes the token as an attack
# surface if a future step is added without noticing the default scope.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  gates:
    name: lint + types + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,voice]"
      # Keyed on the pinned tag+hash inside scripts/fetch_models.py: a
      # model bump changes the key, anything else is a warm-cache hit and
      # the fetch step's skip-if-verified path makes it a no-op.
      - name: Cache VAD model
        uses: actions/cache@v4
        with:
          path: backend/app/voice/models
          key: silero-vad-v6.2.1-1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3
      - name: Fetch VAD model
        run: python -m scripts.fetch_models
      - name: Ruff (repo-wide)
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Pytest (non-Docker suites)
        run: pytest tests -q --ignore=tests/models --ignore=tests/e2e

  docker-gated:
    name: testcontainers suites (ORM + E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The only job with a Docker CLI, so it is the cheapest place to
      # catch a compose syntax/interpolation error before someone hits it
      # on `docker compose up`. `working-directory` overrides the job-wide
      # `backend` default — the compose file is at the repo root.
      # backend/.env is gitignored, and `env_file:` entries must resolve
      # for `config` to succeed, so it is synthesized from the template and
      # removed again (trap, so a failing validation still cleans up) —
      # otherwise Settings' `env_file=".env"` would silently pick it up in
      # the pytest step below.
      - name: Validate compose file
        working-directory: .
        run: |
          cp backend/.env.example backend/.env
          trap 'rm -f backend/.env' EXIT
          docker compose config -q
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest (Docker-gated suites)
        run: pytest tests/models tests/e2e -q
