# CI — the same three gates every PR in this repo has so far run by hand
# (backend/README.md "Development"), now automatic, plus the first-ever
# automated execution of the Docker-gated test dirs.
#
# Two jobs on purpose:
# - `gates` mirrors the local loop exactly (ruff, mypy, non-Docker pytest)
#   and is the signal to watch on every PR. It additionally runs the ONE
#   tests/e2e file that needs no container (see its step below).
# - `docker-gated` runs tests/models + tests/e2e via testcontainers
#   (ubuntu-latest ships a Docker daemon). These suites were written with
#   the Phase-2 build but have NEVER been executed anywhere — no local
#   Docker was available — so this job is genuinely new coverage, not a
#   re-run. It is a separate job so a testcontainers-specific failure is
#   immediately distinguishable from a core-gate failure.
#
# Audit fix (2026-08-05) — tests/e2e/test_voice_pipeline_e2e.py had never
# run in either job. `gates` ignored tests/e2e wholesale, and while
# `docker-gated` does name tests/e2e, it installs only `.[dev]` — so that
# file's `pytest.importorskip("aiortc")` turned it into a silent green
# skip there. The fix routes it to `gates`, on the evidence rather than by
# analogy with its neighbour: the file declares no fixture of its own and
# tests/e2e has no conftest.py, so the testcontainers fixtures in
# test_canonical_conversation.py (module-scoped, including its autouse
# one) do not reach it; its Redis is tests/support/fake_redis, its VAD is
# an in-test energy gate rather than the Silero ONNX model, and its own
# docstring states it "needs no container of its own — only the [voice]
# extra". `gates` is the only job that installs that extra, and installs
# it precisely for this test. `docker-gated` still names tests/e2e as a
# directory (so a future container-needing E2E is picked up automatically)
# and simply skips this one there.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege hardening (security review MEDIUM): neither job performs
# any token-consuming operation, so the ambient GITHUB_TOKEN needs nothing
# beyond checkout. Declaring it explicitly removes the token as an attack
# surface if a future step is added without noticing the default scope.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  gates:
    name: lint + types + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,voice]"
      # Keyed on the pinned tag+hash inside scripts/fetch_models.py: a
      # model bump changes the key, anything else is a warm-cache hit and
      # the fetch step's skip-if-verified path makes it a no-op.
      - name: Cache VAD model
        uses: actions/cache@v4
        with:
          path: backend/app/voice/models
          key: silero-vad-v6.2.1-1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3
      - name: Fetch VAD model
        run: python -m scripts.fetch_models
      - name: Ruff (repo-wide)
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Pytest (non-Docker suites)
        run: pytest tests -q --ignore=tests/models --ignore=tests/e2e
      # Kept a separate step rather than folded into the line above so the
      # step above stays byte-identical to the local gate command
      # (backend/README.md "Development"), and so a failure here is
      # immediately attributable to the integrated voice path.
      #
      # The import check is the point, not ceremony: the file guards itself
      # with `pytest.importorskip("aiortc")`, so without the [voice] extra
      # it reports a green skip — which is exactly how this test went unrun
      # for a whole phase. A missing extra must fail the job loudly instead.
      - name: Pytest (voice E2E — needs [voice], needs no container)
        run: |
          python -c "import aiortc, av, websockets"
          pytest tests/e2e/test_voice_pipeline_e2e.py -q

  docker-gated:
    name: testcontainers suites (ORM + E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The only job with a Docker CLI, so it is the cheapest place to
      # catch a compose syntax/interpolation error before someone hits it
      # on `docker compose up`. `working-directory` overrides the job-wide
      # `backend` default — the compose file is at the repo root.
      # backend/.env is gitignored, and `env_file:` entries must resolve
      # for `config` to succeed, so it is synthesized from the template and
      # removed again (trap, so a failing validation still cleans up) —
      # otherwise Settings' `env_file=".env"` would silently pick it up in
      # the pytest step below.
      - name: Validate compose file
        working-directory: .
        run: |
          cp backend/.env.example backend/.env
          trap 'rm -f backend/.env' EXIT
          docker compose config -q
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # Directories, not files, so a future container-needing suite is
      # picked up without editing this line. `.[dev]` (no `voice`) is
      # deliberate: the only tests/e2e file needing that extra is
      # test_voice_pipeline_e2e.py, which needs no container and therefore
      # runs in `gates` instead — it importorskips to a skip here, and that
      # skip is expected, not a regression.
      - name: Pytest (Docker-gated suites)
        run: pytest tests/models tests/e2e -q
