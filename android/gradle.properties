org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# `checkModuleDependencyRules` collects the module graph in `projectsEvaluated`,
# which only sees every module when all of them are configured. Configuration on
# demand would let a violating module slip through unchecked, so it stays off.
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
