# VyaparPay Android version catalog.
#
# Every version here is pinned explicitly — no ranges, no "+", no "latest". The
# machine this scaffold was authored on has no Android SDK and no Gradle, so CI
# is the first thing that ever compiles it; a floating version would make a red
# build ambiguous between "our code is wrong" and "the world moved".
#
# The ceiling that shapes this whole catalog: AGP 8.13.2 is the last stable 8.x
# and it tops out at API 36.1. AndroidX artifacts publish a `minCompileSdk` in
# their AAR metadata and AGP hard-fails when the project's compileSdk is lower —
# androidx.core 1.19.0 already demands compileSdk 37 / AGP 9.1.0. So the AndroidX
# pins below are the newest releases that still fit under compileSdk 36, verified
# by reading META-INF/com/android/build/gradle/aar-metadata.properties out of each
# published .aar rather than by inference.

[versions]
# --- SDK levels (consumed from each module's android {} block) ---
compileSdk = "36"
minSdk = "24"
targetSdk = "36"

# --- Build tooling ---
# AGP 8.13.2: newest stable 8.x (Google Maven maven-metadata.xml). Requires
# Gradle >= 8.13 and JDK 17; the wrapper pins Gradle 8.14.
agp = "8.13.2"
# Kotlin 2.3.21: KGP 2.3.20-2.3.21 supports Gradle 7.6.3-9.3.0 and AGP 8.2.2-9.0.0
# (kotlinlang.org "Configure a Gradle project" compatibility table), which brackets
# both of our pins. Kotlin 2.2.x would NOT — its AGP ceiling is 8.11.1.
kotlin = "2.3.21"
# KSP is version-decoupled from Kotlin as of 2.3.0; 2.3.10 is the release the
# Kotlin docs' KSP quickstart pairs with the current 2.4.x/2.3.x compilers.
ksp = "2.3.10"

# --- Dependency injection ---
# 2.58 is the newest Hilt that works on AGP 8.x, and the ceiling is sharper than
# it looks. The Hilt Gradle plugin carries a hard version guard: 2.59.1 and later
# refuse to configure below AGP 9.0.0 outright. 2.59 is worse than that — its
# guard still advertises 8.4.0, so it configures and then dies during evaluation
# reaching for the AGP 9-only `ScopedArtifact.POST_COMPILATION_CLASSES`. Both
# were reproduced against this build before settling here; do not "upgrade one
# patch" without moving to AGP 9 first.
hilt = "2.58"
androidxHiltNavigationCompose = "1.3.0"

# --- Compose + AndroidX ---
# BOM 2025.11.01 resolves compose ui/runtime/foundation 1.9.5 and material3 1.4.0
# (read from the BOM's own pom, not the docs site).
composeBom = "2025.11.01"
androidxCore = "1.17.0"
androidxActivity = "1.11.0"
androidxLifecycle = "2.9.4"
androidxNavigation = "2.9.5"

# --- Networking / serialization ---
okhttp = "4.12.0"
retrofit = "3.0.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.10.2"

# --- DI annotations without the full Hilt plugin ---
# JSR-330, unversioned in practice — the same @Inject/@Singleton annotations
# Hilt itself re-exports. Used by modules (:core:screencontext) that annotate
# an injectable class for a later Hilt integration task without yet paying
# for the Hilt Gradle plugin + KSP processor in that module.
javaxInject = "1"

# --- Voice transport ---
# The maintained libwebrtc build (canon ADR-1, docs/03 §3.4). Declared but not
# yet consumed by any module: :voice gains it with WebRtcClient, and pulling a
# ~30 MB native AAR into CI before a single line imports org.webrtc would buy
# build time and a packaging surface for nothing.
webrtc = "144.7559.09"

# --- Test ---
junit = "4.13.2"
turbine = "1.2.1"
robolectric = "4.16.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
# LifecycleService — docs/03 §3.3's VoiceCallService base class, so the
# service's lifecycle is a first-class LifecycleOwner the way every other
# component in the app is (docs/03 §2's UDF/lifecycle-awareness convention).
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
# The base artifact carrying NavController itself, for modules that need the
# type without pulling in Compose (:core:screencontext's NavigationTracker).
androidx-navigation-runtime = { module = "androidx.navigation:navigation-runtime", version.ref = "androidxNavigation" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHiltNavigationCompose" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }

webrtc-android = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc" }

junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
